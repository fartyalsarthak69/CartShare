<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartShare - Collaborative Shopping</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="login-screen" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
            <div class="text-center mb-4">
                <h2 class="text-primary fw-bold">CartShare</h2>
                <p class="text-muted">Collaborative Group Shopping</p>
            </div>
            
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="username" placeholder="e.g., Alex" required>
                </div>
                <div class="mb-3">
                    <label for="roomCode" class="form-label">Room Code</label>
                    <input type="text" class="form-control" id="roomCode" placeholder="e.g., ROOM123" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Join Room</button>
            </form>
        </div>
    </div>

    <!-- ================= MAIN DASHBOARD (Hidden initially) ================= -->
    <!-- Notice the 'd-none' class here. In Bootstrap, d-none means "display: none" (hide this). -->
    <div id="dashboard-screen" class="d-none">
        
        <!-- Navbar / Header -->
        <!-- Navbar / Header -->
        <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
            <div class="container-fluid px-4">
                <span class="navbar-brand mb-0 h1">Room: <strong id="display-room-code">---</strong></span>
                <div class="d-flex align-items-center">
                    <span class="navbar-text text-white me-3">
                        Logged in as: <strong id="display-username">---</strong>
                    </span>
                    <!-- NEW: Leave Room Button -->
                    <button id="btn-leave-room" class="btn btn-sm btn-outline-light">Leave Room</button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="container-fluid px-4">
            <div class="row">
                
                <!-- Left Column: Products -->
                <div class="col-lg-7 mb-4">
                    <h4 class="mb-3">Available Products</h4>
                    <div class="row" id="product-list">
                        <!-- We will generate product cards here using JavaScript later. 
                             For now, here is one placeholder product so you see how it looks. -->
                        <div class="col-sm-6 col-md-4 mb-3">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Milk (1 Gal)</h5>
                                    <p class="card-text text-success fw-bold">$4.99</p>
                                    <button class="btn btn-outline-primary btn-sm w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 col-md-4 mb-3">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Bread</h5>
                                    <p class="card-text text-success fw-bold">$2.49</p>
                                    <button class="btn btn-outline-primary btn-sm w-100">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Cart and Log -->
                <div class="col-lg-5">
                    
                    <!-- Shared Cart Card -->
                    <div class="card shadow-sm mb-4 border-success">
                        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Shared Cart</h5>
                            <span class="badge bg-light text-dark" id="cart-count">0 items</span>
                        </div>
                        <div class="card-body">
                            <ul class="list-group mb-3" id="cart-items">
                                <!-- Cart items will go here -->
                                <li class="list-group-item text-center text-muted">Cart is empty</li>
                            </ul>
                            <div class="d-flex justify-content-between fw-bold mb-3 fs-5">
                                <span>Total:</span>
                                <span>$<span id="cart-total">0.00</span></span>
                            </div>
                            <button onclick="window.print()" class="btn btn-success w-100">Print Receipt</button>
                        </div>
                    </div>

                    <!-- Activity Log Card -->
                    <div class="card shadow-sm border-secondary">
                        <div class="card-header bg-secondary text-white">
                            <h5 class="mb-0">Activity Log</h5>
                        </div>
                        <div class="card-body p-0">
                            <!-- We set a max height and overflow so this area scrolls if it gets too long -->
                            <ul class="list-group list-group-flush" id="activity-log" style="max-height: 250px; overflow-y: auto;">
                                <li class="list-group-item text-center text-muted small">No activity yet</li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
